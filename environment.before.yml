# Reproduction of the ORIGINAL ("before") stack: Python 3.12 + the exact pip pins
# the paper shipped in requirements_pip-mplug-owl3.txt (torch 2.5.1+cu124,
# transformers 4.46.2, numpy 2.0.2, ...). micromamba only provides the interpreter;
# pip installs the frozen requirement set, so the "before" env matches the paper
# bit-for-bit while the "after" env (uv, pyproject.toml) tracks the same core versions.
#
# `import shap` resolves to the vendored ./shap package (cwd precedence), so it is not
# reinstalled here -- both stacks share the same Shapley implementation.
#
# Create with:
#   MAMBA_ROOT_PREFIX="$PWD/.micromamba" ./bin/micromamba env create -y -f environment.before.yml
name: ccshap-vlm-before
channels:
  - conda-forge
dependencies:
  - python=3.12.1
  - pip=24.2
  - pip:
      - -r requirements_pip-mplug-owl3.txt
